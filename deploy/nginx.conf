# 将 <YOUR_DOMAIN> 换成 maimai.imikufans.cn;网关 :8080,前端 :3000
upstream maimai_front { server 127.0.0.1:3000; }
upstream maimai_api { server 127.0.0.1:8080; }

server {
    listen 80;
    server_name <YOUR_DOMAIN>;

    # SSE 实时推送:必须关缓冲
    location = /api/stream {
        proxy_pass http://maimai_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://maimai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://maimai_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
